# Nginx site config for skatedir.com
# Install: copy to /etc/nginx/sites-available/skatedir.com and symlink sites-enabled.
# Requires Node API running on 127.0.0.1:3001 with Postgres configured.

server {
    listen 80;
    listen [::]:80;
    server_name skatedir.com www.skatedir.com;

    # Static React build (npm run build → build/)
    root /var/www/skatedir/build;
    index index.html;

    # API — must come before the SPA fallback
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# After certbot:
# sudo certbot --nginx -d skatedir.com -d www.skatedir.com
