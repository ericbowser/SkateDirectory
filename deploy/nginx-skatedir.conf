# Nginx site config for skatedir.com
# Install: copy to /etc/nginx/sites-available/skatedir.com and symlink sites-enabled.
# Requires Node API running on 127.0.0.1:3001 with Postgres configured.
# This mirrors the live config on the server — keep them in sync when either changes.

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name skatedir.com www.skatedir.com;
    return 301 https://$host$request_uri;
}

# HTTPS — static file server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name skatedir.com www.skatedir.com;

    ssl_certificate /etc/ssl/skatedir.com.pem;
    ssl_certificate_key /etc/ssl/skatedir.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Static React build (npm run build → build/)
    root /var/www/html/SkateDirectory/build;
    index index.html;

    # Hashed build assets (Vite fingerprints filenames) — safe to cache for a year
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else that isn't hashed but is still static build output
    location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|gif|ico|woff2?|ttf|otf|glb)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # API — must come before the SPA fallback, or /api/* falls through to index.html
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML must revalidate so deploys aren't stuck behind a stale shell referencing old hashes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
